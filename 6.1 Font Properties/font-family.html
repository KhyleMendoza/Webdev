<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Font Family</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bevan:ital@0;1&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bevan&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    p {
      font-size: 30px;
    }

    #helvetica {
      font-family: Helvetica, sans-serif;
    }

    #arial {
      font-family: Arial, sans-serif;
    }

    #serif {
      font-family: serif;
    }

    #sans-serif {
      font-family: sans-serif;
    }

    #cursive {
      font-family: cursive;
    }

    #monospace {
      font-family: monospace;
    }

    #fantasy {
      font-family: fantasy;
    }

    #timesnewroman {
      font-family: 'Times New Roman', Times, serif;
    }

    #bevan {
      font-family: "Bevan", serif;
      font-weight: 400;
      font-style: normal;
    }

    #bevan2 {
      font-family: "Bevan", serif;
      font-weight: 400;
      font-style: italic;
    }

    #bebas {
      font-family: "Bebas Neue", sans-serif;
      font-weight: 400;
      font-style: normal;
    }
  </style>
</head>

<body>
  <p id="helvetica">Helvetica</p>
  <p id="arial">Arial</p>
  <p id="serif">Serif</p>
  <p id="sans-serif">Sans Serif</p>
  <p id="cursive">Cursive</p>
  <p id="monospace">Monospace</p>
  <p id="fantasy">Fantasy</p>
  <P id="timesnewroman">Times new roman</P>
  <p id="bevan">Bevan</p>
  <p id="bevan2">Bevan2</p>
  <p id="bebas">Bevas</p>

</body>

</html>
