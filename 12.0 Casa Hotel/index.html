<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <nav>
        <div class="logo">
            <img src="./assets/images/Casa-Hotel-Logo.png" alt="">
            <a href="#">Casa Hotel</a>
        </div>

        <div class="links">
            <a href="#" class="active">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="">Rooms</a>
        </div>

        <div class="sign">
            <a href="#">Sign Up</a>
            <button>Sign In</button>
        </div>
    </nav>

    <section id="hero" class="hero-section">
        <div class="hero">
            <h1>Secure Your Dream <br>Vacation With Reservation</h1>

            <div class="book">
                <div class="location">
                    <label for="location">Location</label>
                    <div class="location-box">
                        <img src="./assets/images/Location-icon.png" height="15" alt="Location-icon">
                        <input type="text" placeholder="Where are you going?" name="location">
                    </div>
                </div>
                <div class="check-in">
                    <label for="checkin">Check In</label>
                    <input type="date" name="checkin">
                </div>
                <div class="check-out">
                    <label for="checkout">Check Out</label>
                    <input type="date" name="checkout">
                </div>
                <div class="person">
                    <label for="person">Person</label>
                    <div class="person-box">
                        <img src="./assets/images/Profile-icon.png" alt="Profile-icon">
                        <input type="text" name="person" placeholder="How many person?">
                    </div>
                </div>
                <div class="search">
                    <button><img src="./assets/images/Search-icon.png" height="15" alt="Search">Search</button>
                </div>
            </div>

            <div  class="tags">
                <div>
                    <p class="tag-number">121+</p>
                    <p>Capital Raised</p>
                </div>
                <div>
                    <p class="tag-number">80+</p>
                    <p>Happy Customers</p>
                </div>
                <div>
                    <p class="tag-number">1K+</p>
                    <p>Propery options</p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
