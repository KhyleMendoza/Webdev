<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <div class="container">
        <h1>BMI Calculator</h1>
        <div>
            <div>
                <label for="weight">Weight:</label>
                <div>
                    <input type="number" name="weight" id="weight" placeholder="Enter width example: 65">
                </div>
            </div>

            <div>
                <label for="height">Height in meter:</label>
                <div class="h-container">
                    <input type="number" name="height" id="height" placeholder="Enter height example: 1.8">
                </div>
            </div>

            <button id="calc">Calculate</button>
            <div id="error">
                <p>Please enter both height and weight!</p>
            </div>
            <div class="bmi">
                <p>BMI Result: <span id="bmi"></span></p>
                <p id="result"></p>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
